<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#000000" />
  <link rel="icon" type="image/svg+xml" href="assets/teeverse-logo-mark-approved-v1.svg" />
  <link rel="apple-touch-icon" href="assets/teeverse-logo-mark-approved-v1.png" />
  <title>TEEVERSE STUDIO · 把灵感穿上身</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script>window.react = window.React;</script>
  <script src="https://unpkg.com/lucide-react@0.441.0/dist/umd/lucide-react.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body, #root { width: 100%; height: 100%; margin: 0; }
    html, body { overflow: hidden; background: #000; }
    body { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
    button, a, input { font: inherit; -webkit-tap-highlight-color: transparent; }
    button:active, a:active { transform: scale(.95); }
    .cinema-shadow { text-shadow: 0 2px 24px rgba(0,0,0,.82), 0 1px 3px rgba(0,0,0,.9); }

    .liquid-glass {
      background: rgba(255, 255, 255, 0.01);
      mix-blend-mode: luminosity;
      -webkit-backdrop-filter: blur(4px);
      backdrop-filter: blur(4px);
      border: none;
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
      position: relative;
      overflow: hidden;
    }
    .liquid-glass::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1.4px;
      background: linear-gradient(to bottom,
        rgba(255,255,255,0.45) 0%, rgba(255,255,255,0.15) 20%,
        rgba(255,255,255,0) 40%, rgba(255,255,255,0) 60%,
        rgba(255,255,255,0.15) 80%, rgba(255,255,255,0.45) 100%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask-composite: exclude;
      pointer-events: none;
    }
    .bottom-blur-mask {
      -webkit-backdrop-filter: blur(24px);
      backdrop-filter: blur(24px);
      -webkit-mask-image: linear-gradient(to top, black 0%, transparent 45%);
      mask-image: linear-gradient(to top, black 0%, transparent 45%);
    }
    @keyframes blurFadeUp {
      from { opacity: 0; filter: blur(20px); transform: translateY(40px); }
      to { opacity: 1; filter: blur(0); transform: translateY(0); }
    }
    .animate-blur-fade-up { opacity: 0; animation: blurFadeUp 1s ease-out forwards; }
    @keyframes slideInLeft { from { opacity:0; transform:translateX(-18px); } to { opacity:1; transform:translateX(0); } }
    .animate-slide-in-left { opacity: 0; animation: slideInLeft .5s ease-out forwards; }
    @keyframes contentIn { from { opacity:0; filter:blur(14px); transform:translateY(24px); } to { opacity:1; filter:blur(0); transform:translateY(0); } }
    .content-in { animation: contentIn .72s cubic-bezier(.22,1,.36,1) forwards; }
    @keyframes videoInRight { from { opacity:0; transform:translateX(4%) scale(1.02); } to { opacity:1; transform:translateX(0) scale(1); } }
    @keyframes videoInLeft { from { opacity:0; transform:translateX(-4%) scale(1.02); } to { opacity:1; transform:translateX(0) scale(1); } }
    @keyframes videoOutLeft { from { opacity:1; transform:translateX(0) scale(1); } to { opacity:0; transform:translateX(-4%) scale(1.02); } }
    @keyframes videoOutRight { from { opacity:1; transform:translateX(0) scale(1); } to { opacity:0; transform:translateX(4%) scale(1.02); } }
    .video-in-right { animation: videoInRight .9s cubic-bezier(.22,1,.36,1) forwards; }
    .video-in-left { animation: videoInLeft .9s cubic-bezier(.22,1,.36,1) forwards; }
    .video-out-left { animation: videoOutLeft .9s cubic-bezier(.22,1,.36,1) forwards; }
    .video-out-right { animation: videoOutRight .9s cubic-bezier(.22,1,.36,1) forwards; }
    @keyframes toastIn { from { opacity:0; transform:translateY(14px) scale(.96); } to { opacity:1; transform:translateY(0) scale(1); } }
    .toast-in { animation: toastIn .3s ease-out forwards; }
    @keyframes panelIn { from { opacity:0; transform:translateY(-10px) scale(.985); } to { opacity:1; transform:translateY(0) scale(1); } }
    .panel-in { animation: panelIn .35s cubic-bezier(.22,1,.36,1) forwards; }
    .product-number { -webkit-text-stroke: 1px rgba(255,255,255,.38); color: transparent; }
    .safe-bottom { padding-bottom: max(2rem, env(safe-area-inset-bottom)); }
    @keyframes handoffBloom { 0%{opacity:0;transform:scale(.18);filter:blur(24px)} 45%{opacity:.92;transform:scale(1);filter:blur(0)} 100%{opacity:1;transform:scale(18);filter:blur(2px)} }
    @keyframes handoffMark { 0%{opacity:0;transform:scale(.82);filter:blur(16px)} 45%{opacity:1;transform:scale(1);filter:blur(0)} 100%{opacity:0;transform:scale(1.12);filter:blur(10px)} }
    .handoff-bloom { animation:handoffBloom .92s cubic-bezier(.65,0,.25,1) forwards; }
    .handoff-mark { animation:handoffMark .92s cubic-bezier(.22,1,.36,1) forwards; }
    .handoff-leaving nav,.handoff-leaving main { opacity:0; filter:blur(18px); transform:scale(.985) translateY(-10px); transition:all .62s cubic-bezier(.4,0,.2,1); }
    .handoff-leaving video { transform:scale(1.045)!important; filter:blur(6px) saturate(.7); transition:all .9s cubic-bezier(.4,0,.2,1); }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
      .animate-blur-fade-up { opacity: 1; }
    }
  </style>
</head>
<body class="bg-black text-white">
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;
    const { Search, User, Menu, X, Star, Timer, CalendarDays, Sparkles, ChevronLeft, ChevronRight, ArrowUpRight, Shirt, Layers3, Palette, ScanLine, Volume2, VolumeX } = LucideReact;

    const NAV_LINKS = ['短袖系列', '工艺实验室', '灵感画廊', '定制流程', '品牌故事'];
    const PRODUCTS = [
      {
        code: '01 / ESSENTIAL', name: 'TEE 01', title: '把灵感，穿上身。',
        desc: '为独一无二的表达而生。上传图案、输入文字、选择颜色，在画布上完成只属于你的定制短袖。',
        meta: ['标准圆领版型', '单件创作入口', '多色方案待核验'], tag: '经典圆领短袖',
        video: 'https://assets.mixkit.co/videos/809/809-2160.mp4', accent: '#d7ff45'
      },
      {
        code: '02 / SIGNATURE', name: 'TEE 02', title: '让作品，成为衣服。',
        desc: '更宽松的街头轮廓，更大的印花表达区域。适合插画、摄影、社群周边与限量创作。',
        meta: ['宽松落肩轮廓', '大幅印花区域', '双面设计入口'], tag: '重磅落肩短袖',
        video: 'https://assets.mixkit.co/videos/42581/42581-2160.mp4', accent: '#86e9ff'
      },
      {
        code: '03 / NIGHT', name: 'TEE 03', title: '白天克制，夜晚发光。',
        desc: '高对比图形与暗色面料的视觉实验。为音乐现场、潮流社群与夜间活动打造。',
        meta: ['暗色视觉方案', '高对比图形', '夜间场景灵感'], tag: '暗夜限定短袖',
        video: 'https://assets.mixkit.co/videos/42286/42286-2160.mp4', accent: '#ff68bd'
      },
      {
        code: '04 / ARCHIVE', name: 'TEE 04', title: '穿过当下，留下作品。',
        desc: '复古色彩、细腻肌理与收藏级标签系统，让每一次定制都拥有自己的编号与故事。',
        meta: ['复古色彩方向', '收藏编号概念', '限量标签入口'], tag: '档案系列短袖',
        video: 'https://assets.mixkit.co/videos/41480/41480-2160.mp4', accent: '#ffd38a'
      }
    ];

    function App() {
      const [menuOpen, setMenuOpen] = useState(false);
      const [searchOpen, setSearchOpen] = useState(false);
      const [query, setQuery] = useState('');
      const [activeNav, setActiveNav] = useState('短袖系列');
      const [index, setIndex] = useState(0);
      const [contentKey, setContentKey] = useState(0);
      const [anim, setAnim] = useState(null);
      const [loading, setLoading] = useState(false);
      const [toast, setToast] = useState(null);
      const [detailsOpen, setDetailsOpen] = useState(false);
      const [muted, setMuted] = useState(true);
      const [handoff, setHandoff] = useState(false);
      const videoRefs = useRef({});
      const product = PRODUCTS[index];

      const notify = useCallback((message) => {
        const id = Date.now();
        setToast({ id, message });
        clearTimeout(notify.timer);
        notify.timer = setTimeout(() => setToast(null), 2600);
      }, []);

      const switchTo = useCallback((next, dir) => {
        if (anim || next === index) return;
        setAnim({ from: index, to: next, dir });
        setLoading(true);
        setIndex(next);
        setContentKey(k => k + 1);
        setDetailsOpen(false);
      }, [anim, index]);

      const go = (dir) => switchTo((index + dir + PRODUCTS.length) % PRODUCTS.length, dir);

      useEffect(() => {
        if (!anim) return;
        const t = setTimeout(() => { setAnim(null); setLoading(false); }, 950);
        return () => clearTimeout(t);
      }, [anim]);

      useEffect(() => {
        Object.entries(videoRefs.current).forEach(([key, v]) => {
          if (!v) return;
          v.muted = muted;
          if (+key === index) v.play().catch(() => {}); else v.pause();
        });
      }, [index, muted]);

      const videoClass = (i) => {
        if (anim && i === anim.to) return anim.dir > 0 ? 'video-in-right z-[2]' : 'video-in-left z-[2]';
        if (anim && i === anim.from) return anim.dir > 0 ? 'video-out-left z-[1]' : 'video-out-right z-[1]';
        return i === index ? 'z-[1] opacity-100' : 'opacity-0';
      };
      const adjacent = (i) => { const d = Math.abs(i-index); return d === 1 || d === PRODUCTS.length-1; };

      const submitSearch = (e) => {
        e.preventDefault();
        if (!query.trim()) return notify('请输入款式、颜色或工艺关键词');
        notify(`正在为你寻找「${query.trim()}」相关灵感`);
        setSearchOpen(false); setQuery('');
      };

      const navClick = (link) => {
        setActiveNav(link); setMenuOpen(false);
        if (link === '短袖系列') notify('使用底部箭头浏览 4 个短袖系列');
        else notify(`「${link}」完整内容将在下一阶段接入`);
      };

      const enterCustomizer = (e) => {
        e.preventDefault();
        if (handoff) return;
        setHandoff(true);
        sessionStorage.setItem('teeverse-handoff', JSON.stringify({product:product.name,video:product.video,accent:product.accent,at:Date.now()}));
        const target = `customizer.html?product=${encodeURIComponent(product.name)}&from=showcase`;
        setTimeout(() => { location.href = target; }, 900);
      };

      return <div data-handoff={handoff?'leaving':'idle'} className={`relative flex h-screen w-screen flex-col overflow-hidden bg-black text-white ${handoff?'handoff-leaving':''}`}>
        <div className="fixed inset-0 z-0 overflow-hidden bg-black">
          {PRODUCTS.map((p, i) => <video
            key={p.video} data-video-index={i} ref={el => videoRefs.current[i] = el}
            className={`absolute inset-0 h-full w-full object-cover ${videoClass(i)}`}
            src={p.video} autoPlay={i === 0} muted={muted} loop playsInline
            preload={i === index || adjacent(i) ? 'auto' : 'none'}
            onCanPlay={() => { if (anim && i === anim.to) setLoading(false); }}
            onWaiting={() => { if (i === index) setLoading(true); }}
          />)}
        </div>
        <div className="bottom-blur-mask pointer-events-none fixed inset-0 z-[1]" />

        <nav className="relative z-50 flex items-center justify-between px-4 py-4 sm:px-6 md:px-12 md:py-6">
          <button onClick={() => notify('TEEVERSE · MADE BY YOU')} aria-label="TEEVERSE 首页" className="animate-blur-fade-up flex shrink-0 items-center" style={{animationDelay:'0ms'}}>
            <img src="assets/teeverse-logo-approved-v1.svg" alt="TEEVERSE" className="h-9 w-auto select-none object-contain sm:h-10 md:h-12" draggable="false" />
          </button>

          <div className="hidden items-center gap-7 lg:flex xl:gap-10">
            {NAV_LINKS.map((link, i) => <button key={link} onClick={() => navClick(link)}
              className={`animate-blur-fade-up relative py-2 text-xs transition-colors duration-300 hover:text-gray-300 ${activeNav===link?'text-white':'text-gray-300'}`}
              style={{animationDelay:`${100+i*50}ms`}}>
              {link}<span className={`absolute bottom-0 left-0 h-px bg-white transition-all duration-300 ${activeNav===link?'w-full':'w-0'}`} />
            </button>)}
          </div>

          <div className="flex items-center gap-2">
            <button onClick={() => setSearchOpen(v=>!v)} className="animate-blur-fade-up liquid-glass hidden items-center gap-2 rounded-full px-6 py-2 text-sm sm:flex md:px-8" style={{animationDelay:'350ms'}}><Search size={18}/><span>搜索</span></button>
            <button onClick={() => notify('个人中心将在订单系统接入后开放')} aria-label="个人中心" className="animate-blur-fade-up liquid-glass hidden h-10 w-10 items-center justify-center rounded-full sm:flex" style={{animationDelay:'400ms'}}><User size={18}/></button>
            <button onClick={() => setMuted(v=>!v)} aria-label={muted?'开启声音':'关闭声音'} className="animate-blur-fade-up liquid-glass hidden h-10 w-10 items-center justify-center rounded-full md:flex" style={{animationDelay:'450ms'}}>{muted?<VolumeX size={18}/>:<Volume2 size={18}/>}</button>
            <button onClick={() => setMenuOpen(v=>!v)} aria-expanded={menuOpen} aria-label="菜单" className="animate-blur-fade-up liquid-glass relative flex h-10 w-10 items-center justify-center rounded-full lg:hidden" style={{animationDelay:'350ms'}}>
              <Menu size={20} className={`absolute transition-all duration-500 ${menuOpen?'rotate-180 scale-50 opacity-0':'rotate-0 scale-100 opacity-100'}`}/>
              <X size={20} className={`absolute transition-all duration-500 ${menuOpen?'rotate-0 scale-100 opacity-100':'rotate-180 scale-50 opacity-0'}`}/>
            </button>
          </div>
        </nav>

        {searchOpen && <div className="panel-in absolute left-4 right-4 top-[72px] z-40 sm:left-auto sm:right-6 sm:w-[480px] md:right-12 md:top-[92px]">
          <form onSubmit={submitSearch} className="liquid-glass flex items-center gap-3 rounded-2xl px-4 py-3 shadow-2xl shadow-black/50">
            <Search size={18} className="shrink-0 text-gray-300"/><input autoFocus value={query} onChange={e=>setQuery(e.target.value)} placeholder="搜索款式、颜色、印花工艺…" className="min-w-0 flex-1 bg-transparent text-sm outline-none placeholder:text-gray-400"/>
            <button type="submit" className="rounded-full bg-white px-4 py-2 text-xs font-semibold text-black hover:bg-gray-200">搜索</button>
            <button type="button" onClick={()=>setSearchOpen(false)} className="liquid-glass rounded-full p-2"><X size={16}/></button>
          </form>
        </div>}

        <div className={`absolute left-0 right-0 top-[72px] z-40 border-y border-gray-700/50 bg-gray-900/95 shadow-2xl shadow-black/60 backdrop-blur-xl transition-all duration-500 ease-out lg:hidden ${menuOpen?'translate-y-0 opacity-100':'pointer-events-none -translate-y-1 opacity-0'}`}>
          <div className="px-3 py-2">
            {NAV_LINKS.map((link,i)=><button key={link} onClick={()=>navClick(link)} className={`block w-full rounded px-3 py-3 text-left text-sm hover:bg-white/5 ${menuOpen?'animate-slide-in-left':''}`} style={menuOpen?{animationDelay:`${i*50}ms`}:undefined}>{link}</button>)}
          </div>
          <div className="flex gap-2 border-t border-white/10 p-3 sm:hidden">
            <button onClick={()=>{setMenuOpen(false);setSearchOpen(true)}} className="liquid-glass flex flex-1 items-center justify-center gap-2 rounded-full py-2"><Search size={18}/>搜索</button>
            <button onClick={()=>notify('个人中心将在订单系统接入后开放')} className="liquid-glass flex flex-1 items-center justify-center gap-2 rounded-full py-2"><User size={18}/>个人中心</button>
          </div>
        </div>

        <main className="safe-bottom relative z-10 flex min-h-0 flex-1 items-end px-4 sm:px-6 md:px-12">
          <div className="flex w-full flex-col gap-8 md:flex-row md:items-end md:justify-between">
            <section key={contentKey} className="min-w-0 flex-1">
              <div className="animate-blur-fade-up mb-6 flex flex-wrap items-center gap-3 text-xs sm:gap-6 sm:text-sm md:mb-8" style={{animationDelay:'300ms'}}>
                <span className="flex items-center gap-2"><Star size={16} className="fill-white"/> PREMIUM CUSTOM</span>
                <span className="flex items-center gap-2"><Timer size={16}/>{product.meta[1]}</span>
                <span className="flex items-center gap-2"><CalendarDays size={16}/>2026 COLLECTION</span>
              </div>
              <p className="content-in mb-3 text-xs font-semibold tracking-[.32em] text-gray-300">{product.code} · {product.tag}</p>
              <h1 className="cinema-shadow content-in mb-4 max-w-5xl text-4xl font-normal leading-[.94] tracking-[-.055em] sm:text-6xl md:mb-6 md:max-w-none md:whitespace-nowrap md:text-[clamp(3.5rem,5.5vw,6rem)]">{product.title}</h1>
              <p className="cinema-shadow content-in mb-6 max-w-2xl text-base leading-relaxed text-gray-300 sm:text-lg md:mb-10 md:text-xl">{product.desc}</p>
              <div className="flex flex-wrap items-center gap-3 sm:gap-4">
                <a href={`customizer.html?product=${encodeURIComponent(product.name)}`} onClick={enterCustomizer} aria-disabled={handoff} className="animate-blur-fade-up group flex items-center gap-2 rounded-full bg-white px-6 py-2.5 font-medium text-black transition-colors hover:bg-gray-200 sm:px-8 sm:py-3" style={{animationDelay:'600ms'}}>
                  <Sparkles size={18}/><span>{handoff?'正在进入创作空间':'立即定制'}</span><ArrowUpRight size={17} className="transition-transform group-hover:-translate-y-0.5 group-hover:translate-x-0.5"/>
                </a>
                <button onClick={()=>setDetailsOpen(true)} className="animate-blur-fade-up liquid-glass flex items-center gap-2 rounded-full px-6 py-2.5 sm:px-8 sm:py-3" style={{animationDelay:'700ms'}}><ScanLine size={18}/><span>探索面料</span></button>
              </div>
            </section>

            <aside className="flex shrink-0 items-end justify-between gap-5 md:flex-col md:items-end">
              <span className="product-number hidden text-7xl font-semibold tracking-[-.08em] md:block lg:text-8xl">0{index+1}</span>
              <div className="flex flex-col items-end gap-3">
                {loading && <span className="rounded-full bg-black/50 px-3 py-1 text-xs text-white/70 backdrop-blur-sm">正在载入 4K 影片…</span>}
                <div className="flex gap-2">
                  <button disabled={!!anim} onClick={()=>go(-1)} aria-label="上一款" className="animate-blur-fade-up liquid-glass rounded-full px-4 py-2.5 disabled:opacity-50 sm:px-6 sm:py-3" style={{animationDelay:'800ms'}}><ChevronLeft size={20}/></button>
                  <button disabled={!!anim} onClick={()=>go(1)} aria-label="下一款" className="animate-blur-fade-up liquid-glass rounded-full px-4 py-2.5 disabled:opacity-50 sm:px-6 sm:py-3" style={{animationDelay:'900ms'}}><ChevronRight size={20}/></button>
                </div>
                <div className="flex items-center gap-2">
                  {PRODUCTS.map((p,i)=><button key={p.name} disabled={!!anim} onClick={()=>switchTo(i,i>index?1:-1)} aria-label={`切换至 ${p.name}`} className={`h-1.5 rounded-full transition-all duration-300 ${i===index?'w-9 bg-white':'w-1.5 bg-white/30 hover:bg-white/60'}`}/>) }
                </div>
              </div>
            </aside>
          </div>
        </main>

        {detailsOpen && <div className="fixed inset-0 z-[70] flex items-end justify-end bg-black/25 p-4 backdrop-blur-sm sm:p-6" onClick={()=>setDetailsOpen(false)}>
          <div className="panel-in liquid-glass w-full max-w-lg rounded-[28px] bg-black/55 p-6 shadow-2xl shadow-black/60 sm:p-8" onClick={e=>e.stopPropagation()}>
            <div className="mb-8 flex items-start justify-between"><div><p className="mb-2 text-xs tracking-[.28em] text-gray-400">MATERIAL PROFILE</p><h2 className="text-3xl font-medium">{product.tag}</h2></div><button onClick={()=>setDetailsOpen(false)} className="liquid-glass rounded-full p-3"><X size={18}/></button></div>
            <div className="grid grid-cols-3 gap-2">{product.meta.map((m,i)=><div key={m} className="rounded-2xl border border-white/10 bg-white/[.04] p-4"><div className="mb-4 text-gray-400">{i===0?<Shirt size={18}/>:i===1?<Layers3 size={18}/>:<Palette size={18}/>}</div><p className="text-sm">{m}</p></div>)}</div>
            <p className="mt-6 text-sm leading-relaxed text-gray-400">当前为首屏展示参数。详细面料克重、色卡、尺码与实时报价将在定制器阶段接入真实供应链数据。</p>
          </div>
        </div>}

        {handoff && <div className="pointer-events-none fixed inset-0 z-[100] grid place-items-center overflow-hidden bg-black/10">
          <div className="handoff-bloom absolute h-28 w-28 rounded-full" style={{background:'radial-gradient(circle, rgba(250,252,255,.96) 0%, rgba(188,197,208,.62) 18%, rgba(111,121,134,.32) 40%, rgba(30,34,40,.18) 58%, rgba(0,0,0,0) 74%)',boxShadow:'0 0 90px rgba(194,205,218,.22), 0 0 180px rgba(85,94,106,.16)'}} />
          <div className="handoff-mark relative z-10 flex flex-col items-center gap-4">
            <img src="assets/teeverse-logo-mark-approved-v1.svg" className="h-20 w-20 drop-shadow-[0_0_28px_rgba(255,255,255,.35)]" alt=""/>
            <span className="text-[10px] tracking-[.34em] text-white/75">ENTERING CUSTOM LAB</span>
          </div>
        </div>}
        {toast && <div key={toast.id} className="toast-in fixed bottom-4 right-4 z-[90] sm:bottom-6 sm:right-6"><div className="liquid-glass flex max-w-[calc(100vw-2rem)] items-center gap-2.5 rounded-full bg-black/30 px-5 py-3 text-sm"><Shirt size={16}/><span className="truncate">{toast.message}</span></div></div>}
      </div>;
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
