<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="glassFace" x1="43" y1="36" x2="282" y2="287" gradientUnits="userSpaceOnUse">
    <stop stop-color="#FFFFFF" stop-opacity="0.22"/>
    <stop offset="0.22" stop-color="#DCEBFF" stop-opacity="0.08"/>
    <stop offset="0.55" stop-color="#7E8DAD" stop-opacity="0.04"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.13"/>
  </linearGradient>
  <linearGradient id="glassRim" x1="57" y1="48" x2="265" y2="277" gradientUnits="userSpaceOnUse">
    <stop stop-color="#FFFFFF" stop-opacity="0.9"/>
    <stop offset="0.17" stop-color="#FFFFFF" stop-opacity="0.2"/>
    <stop offset="0.46" stop-color="#86B8FF" stop-opacity="0.18"/>
    <stop offset="0.72" stop-color="#D8B9FF" stop-opacity="0.32"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.72"/>
  </linearGradient>
  <linearGradient id="prism" x1="90" y1="73" x2="229" y2="240" gradientUnits="userSpaceOnUse">
    <stop stop-color="#FFFFFF"/>
    <stop offset="0.2" stop-color="#D7E7FF"/>
    <stop offset="0.44" stop-color="#FFFFFF" stop-opacity="0.78"/>
    <stop offset="0.67" stop-color="#D9C8FF" stop-opacity="0.88"/>
    <stop offset="0.84" stop-color="#A7F4F0" stop-opacity="0.72"/>
    <stop offset="1" stop-color="#FFFFFF"/>
  </linearGradient>
  <linearGradient id="wordmark" x1="356" y1="100" x2="1057" y2="207" gradientUnits="userSpaceOnUse">
    <stop stop-color="#EAFBFF"/>
    <stop offset="0.24" stop-color="#A9DFFF"/>
    <stop offset="0.5" stop-color="#E7DCFF"/>
    <stop offset="0.76" stop-color="#B7F1EC"/>
    <stop offset="1" stop-color="#D7E7FF"/>
  </linearGradient>
  <radialGradient id="innerBloom" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(126 91) rotate(52) scale(196 181)">
    <stop stop-color="#B8E8FF" stop-opacity="0.22"/>
    <stop offset="0.48" stop-color="#A98CFF" stop-opacity="0.07"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
  </radialGradient>
  <filter id="softShadow" x="-30%" y="-30%" width="160%" height="180%">
    <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#020308" flood-opacity="0.48"/>
  </filter>
  <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="9" result="blur"/>
    <feComposite in="blur" in2="SourceGraphic" operator="over"/>
  </filter>
  <filter id="microBlur" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="2.2"/>
  </filter>
  <clipPath id="squircle"><rect x="44" y="34" width="252" height="252" rx="78"/></clipPath>
</defs>

<!-- Liquid-glass monogram tile -->
<g filter="url(#softShadow)">
  <rect x="44" y="34" width="252" height="252" rx="78" fill="url(#glassFace)"/>
  <rect x="45" y="35" width="250" height="250" rx="77" stroke="url(#glassRim)" stroke-width="2"/>
  <rect x="52" y="42" width="236" height="236" rx="70" stroke="#FFFFFF" stroke-opacity="0.08"/>
  <g clip-path="url(#squircle)">
    <ellipse cx="118" cy="70" rx="118" ry="70" fill="url(#innerBloom)"/>
    <path d="M31 238C93 185 167 169 314 182" stroke="#96EAF4" stroke-opacity="0.09" stroke-width="52" filter="url(#microBlur)"/>
    <path d="M83 16C138 99 207 105 327 70" stroke="#D7C4FF" stroke-opacity="0.08" stroke-width="34" filter="url(#microBlur)"/>
  </g>
  <!-- top glass reflection -->
  <path d="M76 89C91 55 121 48 170 48H214C250 48 270 67 279 94" stroke="white" stroke-opacity="0.2" stroke-width="3" stroke-linecap="round"/>
</g>

<!-- Abstract T-shirt / T monogram: shoulders, neckline, print axis -->
<g filter="url(#softGlow)">
  <path d="M98 111L133 90C144 107 154 114 170 114C186 114 196 107 207 90L242 111L229 139L204 126V226H136V126L111 139L98 111Z" fill="white" fill-opacity="0.035" stroke="url(#prism)" stroke-width="5" stroke-linejoin="round"/>
  <path d="M133 90C139 118 201 118 207 90" stroke="url(#prism)" stroke-width="5" stroke-linecap="round"/>
  <path d="M126 126H214" stroke="url(#prism)" stroke-width="12" stroke-linecap="round"/>
  <path d="M170 128V216" stroke="url(#prism)" stroke-width="12" stroke-linecap="round"/>
</g>

<!-- discreet customizer transform nodes -->
<g>
  <circle cx="88" cy="101" r="3.5" fill="#FFFFFF" fill-opacity="0.82"/>
  <circle cx="252" cy="101" r="3.5" fill="#C8D8FF" fill-opacity="0.82"/>
  <circle cx="88" cy="236" r="3.5" fill="#D8C9FF" fill-opacity="0.82"/>
  <circle cx="252" cy="236" r="3.5" fill="#BDF4EE" fill-opacity="0.82"/>
  <path d="M88 91V81H98M242 81H252V91M88 246V256H98M242 256H252V246" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="1.5" stroke-linecap="round"/>
</g>

<!-- Editorial wordmark -->
<g>
  <text x="354" y="184" fill="url(#wordmark)" font-family="Inter, Arial, sans-serif" font-size="101" font-weight="500" letter-spacing="15">TEEVERSE</text>
  <path d="M358 211H1057" stroke="url(#glassRim)" stroke-opacity="0.45"/>
  <circle cx="358" cy="240" r="3" fill="#D9E8FF"/>
  <text x="379" y="247" fill="#BBD9EA" fill-opacity="0.84" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="500" letter-spacing="8">MADE BY YOU</text>
  <text x="891" y="247" fill="#C8BDEB" fill-opacity="0.62" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" letter-spacing="4">CUSTOM / 01</text>
</g>
</svg>
